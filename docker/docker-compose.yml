  # PostgreSQL service (pgvector)
  pgvector:
    image: ankane/pgvector:0.8.6-pg18-trixie
    container_name: pgvector
    env_file:
      - ./env/.env.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgv_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

