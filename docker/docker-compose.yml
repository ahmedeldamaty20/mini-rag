services:
  # FastAPI service
  fastapi:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ..
      dockerfile: docker/minirag/Dockerfile
    container_name: fastapi
    volumes:
      - fastapi_data:/app/assets
    env_file:
      - ./env/.env.app
    ports:
      - "8000:8000"
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy

  # Nginx service
  nginx:
    image: nginx:1.30.4
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - backend
    restart: always
    depends_on:
      - fastapi


  # PostgreSQL service (pgvector)
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: pgvector
    env_file:
      - ./env/.env.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgv_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

  # Qdrant service (Vector database)
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always

  # Prometheus service (Monitoring for metrics)
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/console"
      - "--web.enable-lifecycle"

  # Grafana service (Visualization for metrics)
  grafana:
    image: grafana/grafana:13.1.4
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    ports:
      - "3000:3000"
    networks:
      - backend
    restart: always
    depends_on:
      - prometheus


  # Node Exporter service (Monitoring for node metrics)
  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
    networks:
      - backend
    restart: always

  # Postgres Exporter service (Monitoring for PostgreSQL metrics)
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    env_file:
      - ./env/.env.postgres_exporter
    ports:
      - "9187:9187"
    networks:
      - backend
    restart: always
    depends_on:
      - pgvector

  # RabbitMQ service (Message broker)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    env_file:
      - ./env/.env.rabbitmq
    ports:
      - "5672:5672"   # AMQP port (for message broker)
      - "15672:15672" # UI port (for management interface)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.8
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./env/.env.redis
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 30s
      interval: 30s
      retries: 5
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]

networks:
  backend:
    driver: bridge

volumes:
  pgv_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  fastapi_data:
  rabbitmq_data:
  redis_data:
