[project]
name = "mini-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "cohere>=7.0.8",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "motor>=3.7.1",
    "openai>=3.2.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
mini-rag = "mini_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
