[project]
name = "mini-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "amqp>=5.3.1",
    "asyncpg>=0.31.0",
    "billiard>=4.2.4",
    "celery>=5.6.3",
    "cohere>=7.0.8",
    "fastapi-health>=0.4.0",
    "fastapi[standard]>=0.141.1",
    "kombu>=5.6.2",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "motor>=3.7.1",
    "nltk>=3.10.3",
    "openai>=3.2.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "starlette-exporter>=0.24.0",
    "vine>=5.1.0",
]

[project.scripts]
mini-rag = "mini_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
